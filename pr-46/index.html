  <header class="site-header"><div><h1>Living World Map</h1><p>A little atlas for a world in progress.</p></div><div class="actions"><button id="theme-toggle" type="button" aria-pressed="false">Dark interface</button><button id="open-json" type="button" aria-haspopup="dialog" aria-controls="json-flyout" aria-expanded="false">World JSON</button><button id="save" type="button">Save in browser</button><button id="load" type="button">Load saved world</button><button id="export-json" type="button">Export JSON</button><button id="export-svg" type="button">Export SVG</button></div></header>
  <main class="app-shell">
    <section class="panel" aria-labelledby="map-heading">
      <div class="panel-heading"><div><h2 id="map-heading">Map</h2><p id="status" role="status" aria-live="polite">Loading sample world…</p></div></div>
      <div class="toolbar" role="group" aria-label="Map modes">
        <button class="icon-button" type="button" data-mode="select" aria-label="Move settlements" data-tooltip="Move settlements" aria-pressed="true"><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 8 7l5 4.5V19H4v-7.5Z"/><path d="M15.5 3v7m0-7-2 2m2-2 2 2m-2 16v-7m0 7-2-2m2 2 2-2M12 12h9m0 0-2-2m2 2-2 2"/></svg></button>
        <button class="icon-button" type="button" data-mode="pan" aria-label="Move map" data-tooltip="Move map" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m0-18-3 3m3-3 3 3m-3 15-3-3m3 3 3-3M3 12h18M3 12l3-3m-3 3 3 3m15-3-3-3m3 3-3 3"/></svg></button>
        <button class="icon-button" id="brush-mode" type="button" data-mode="brush" aria-label="Brush" data-tooltip="Brush" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4.5 5 5L10 19H5v-5l9.5-9.5Z"/><path d="m12.5 6.5 5 5M5 19c-1.5 0-2.5.7-2.5 2 1.8 0 3.2-.5 4-2"/></svg></button>
        <span class="toolbar-spacer"></span><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="reset-view" type="button">Reset view</button>
      </div>
      <div class="toolbar" aria-label="Brush controls"><label for="brush-type">Brush</label><select id="brush-type"><option value="land">Land</option><option value="water">Water</option><option value="mountainRange">Mountain range</option></select><label for="brush-size">Size</label><input id="brush-size" type="range" min="10" max="120" step="2" value="40"><output id="brush-size-value" for="brush-size">40</output><button id="undo-brush" type="button">Undo last stroke</button></div>
      <div class="toolbar" aria-label="Add map feature"><span id="placement-status">No feature awaiting placement</span><label for="settlement-name">Name</label><input id="settlement-name" type="text" value="New settlement"><label for="settlement-type">Type</label><select id="settlement-type"><option>town</option><option>city</option><option>village</option><option>castle</option></select><button id="add-settlement" type="button" data-placement="settlement" aria-pressed="false">Add settlement</button><button id="add-mountain" type="button" data-placement="mountain" aria-pressed="false">Add mountain</button><button id="cancel-placement" type="button" hidden>Cancel placement</button></div>
      <div class="map-frame"><svg id="map" xmlns="http://<scrubbed-url-domain>/2000/svg" role="img" aria-label="Fantasy world map"></svg></div>
    </section>
  </main>
